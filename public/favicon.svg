<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#0284c7" stroke-width="10" stroke-opacity="0.5" />

  <!-- Outer Aperture Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#cyanGrad)" stroke-width="16" stroke-dasharray="64 24" filter="url(#glow)" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#0ea5e9" stroke-width="10" opacity="0.5" />

  <!-- Director Play Eye Triangle -->
  <polygon points="210,165 345,256 210,347" fill="url(#cyanGrad)" filter="url(#glow)" />

  <!-- Golden Horizon Flare Line -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="url(#amberGrad)" stroke-width="12" stroke-linecap="round" opacity="0.9" />

  <!-- Optical Center Spark -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" />
</svg>
