<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8" />

  <!-- Glowing Outer Film Reel Aperture Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGrad)" stroke-width="16" opacity="0.5" filter="url(#glow)" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="28 16" />

  <!-- Camera Lens Inner Shutter Ring -->
  <circle cx="256" cy="256" r="110" fill="#020617" stroke="url(#cyanGrad)" stroke-width="12" />

  <!-- Stylized Cinema Director "M" Emblem -->
  <path d="M 168 320 L 168 192 L 224 256 L 256 216 L 288 256 L 344 192 L 344 320" fill="none" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Glowing Director Camera Lens Play Core -->
  <polygon points="242,224 286,256 242,288" fill="url(#cyanGrad)" />
</svg>
